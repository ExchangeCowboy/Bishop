name: Publish alpha release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

concurrency:
  group: bishop-alpha-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Package committed files and verify clean defaults
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$version" = "0.12.0-alpha"
          asset="Bishop-$version-windows.zip"
          git archive --format=zip --prefix="Bishop-$version/" --output="$RUNNER_TEMP/$asset" HEAD
          python3 - "$RUNNER_TEMP/$asset" "Bishop-$version/" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              prefix = sys.argv[2]
              paths = [name[len(prefix):] for name in archive.namelist() if not name.endswith('/')]
              forbidden = ('node_modules/', 'memory/', 'development/work/', 'skills/.revisions/', '.git/')
              assert not any(path.startswith(forbidden) for path in paths), 'Private/local state in archive'
              for required in ('install.cmd', 'install.ps1', 'INSTALLATION.md', 'package-lock.json', 'LICENSE', 'app/cli.ts'):
                  assert required in paths, 'Missing ' + required
              assert archive.read(prefix + 'config/personality/soul.md') == b'# Soul\n'
              assert archive.read(prefix + 'config/personality/memory.md') == b'# Memory\n'
              config = archive.read(prefix + 'config/bishop.toml').decode()
              assert 'first_run = true' in config and '\nmodel = ' not in config
          PY
          (cd "$RUNNER_TEMP" && sha256sum "$asset" > "$asset.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Publish release and download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.package.outputs.version }}
          ASSET: ${{ steps.package.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --prerelease=false --latest
            echo "Existing release is now a normal release marked Latest."
            exit 0
          fi
          gh release create "$tag" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$ASSET.sha256" \
            --target "$GITHUB_SHA" --title "Bishop 0.12 alpha" \
            --notes-file RELEASE_NOTES.md --latest
